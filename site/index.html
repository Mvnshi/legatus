<div id="root">
  <!-- Painted before any script runs, so the headline and both actions are on screen straight away.
       React replaces it. src/content/prepaint.test.ts keeps this copy identical to the hero. -->
  <div class="prepaint">
    <header class="prepaint__bar"><span class="prepaint__brand">Legatus</span></header>
    <section class="prepaint__hero">
      <h1 class="prepaint__title">Your agents. One command center.</h1>
      <p class="prepaint__lede">Queue coding tasks, isolate every change, and review the checks and diff in one local workspace.</p>
      <p class="prepaint__actions">
        <a class="prepaint__btn prepaint__btn--go" href="#demo">Try the demo</a>
        <a class="prepaint__btn" href="#install">Download Legatus</a>
      </p>
    </section>
  </div>
  <noscript>
    <p class="prepaint__noscript">The interactive demo needs JavaScript. Everything else is on GitHub:
      <a href="https://github.com/Mvnshi/legatus">source</a>,
      <a href="https://github.com/Mvnshi/legatus/releases">releases</a> and
      <a href="https://github.com/Mvnshi/legatus/blob/main/docs/STATUS.md">what is verified</a>.</p>
  </noscript>
</div>
<script type="module" src="/src/main.tsx"></script>
